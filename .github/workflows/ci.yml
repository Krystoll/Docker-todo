name: CI/CD Pipeline

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:

  # JOB 1 — BUILD
  # Проверяет что приложение собирается (без тестов)
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Build without tests
        working-directory: ./app
        run: mvn package -DskipTests -B

  # JOB 2 — LINT
  # Запускает Checkstyle. Падает при нарушении правил.
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Run Checkstyle
        working-directory: ./app
        run: mvn checkstyle:check -B

  # JOB 3 — TEST + COVERAGE
  # Запускает тесты и проверяет coverage ≥ 50%.
  # Сохраняет HTML-отчёт JaCoCo как artifact.
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Run tests and check coverage
        working-directory: ./app
        run: mvn verify -B
        # verify = compile + test + jacoco:report + jacoco:check
        # Упадёт если coverage < 50% (настроено в pom.xml)

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        # always() = загружаем отчёт ДАЖЕ если тест упал
        with:
          name: jacoco-coverage-report
          path: app/target/site/jacoco/
          retention-days: 7

  # JOB 4 — DOCKER BUILD
  # Проверяет что Dockerfile собирается без ошибок.
  # Запускается только после build + lint + test.
  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ build, lint, test ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.KRYSTOLL }}/todo-app:${{ env.SHA }} \
            -t ${{ secrets.KRYSTOLL }}/todo-app:latest \
            ./app

  # JOB 5 — DOCKER PUSH
  # Пушит образ на Docker Hub.
  # Запускается только при пуше в main (не для PR).

  docker_push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: [ docker_build ]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.KRYSTOLL }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.KRYSTOLL }}/todo-app:${{ env.SHA }}
            ${{ secrets.KRYSTOLL }}/todo-app:latest